<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MixLabo — Рецепты / Rezepte</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 0%,#30104c,#070a19 60%);color:#f9f5ff;font:16px/1.55 Arial,sans-serif}main{max-width:1050px;margin:auto;padding:28px 20px 75px}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{font-size:clamp(28px,5vw,44px);color:#71edff;text-shadow:0 0 18px #21bbee}a{color:#6be9ff}.btn{background:#21143a;color:white;padding:11px 20px;border:1px solid #ef57ff;border-radius:30px;cursor:pointer}.card{margin:24px 0;border:1px solid #bf55e4;border-radius:18px;padding:23px;background:#0e1732;box-shadow:0 0 20px #8c2dfb33}.card h2{color:#ff82ed;margin:0}.card img{max-width:100%;max-height:380px;object-fit:cover;border-radius:13px;margin:15px 0}.content{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#adbed8}h3{color:#86f7eb}</style></head><body><main><header><h1>🍹 MixLabo — <span id="heading">Рецепты</span></h1><div><a href="./index.html">← MixLabo</a> <button class="btn" id="lang">🇩🇪 DE</button></div></header><p id="intro" class="muted">Рецепты, проверенные редакцией MixLabo</p><section id="recipes"></section></main><script id="recipe-data" type="application/json">[{"id":"1795459645611","titleRu":"Малиновый коктейль со сливками","titleDe":"Himbeer-Cocktail mit Sahne","ingredientsRu":"100 г свежей малины\n\n100 мл сливок 10%\n\n150 мл холодного молока\n\n1–2 чайные ложки сахара\n\n4 кубика льда","ingredientsDe":"100 g frische Himbeeren\n\n100 ml Sahne 10 %\n\n150 ml kalte Milch\n\n1–2 Teelöffel Zucker\n\n4 Eiswürfel","stepsRu":"Малину промыть и положить в блендер. Добавить молоко, сливки и сахар. Взбивать 30–40 секунд до однородной консистенции. Добавить лёд и ещё раз коротко взбить. Перелить в высокий бокал и украсить свежей малиной.","stepsDe":"Die Himbeeren waschen und in den Mixer geben. Milch, Sahne und Zucker hinzugeben. 30–40 Sekunden lang mixen, bis eine homogene Konsistenz entsteht. Eis hinzufügen und noch einmal kurz mixen. In ein hohes Glas umfüllen und mit frischen Himbeeren garnieren.","author":"","image":""}]</script><script>
const rows=JSON.parse(document.getElementById('recipe-data').textContent);let de=false;const root=document.getElementById('recipes');function add(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function render(){document.documentElement.lang=de?'de':'ru';document.getElementById('heading').textContent=de?'Rezepte':'Рецепты';document.getElementById('intro').textContent=de?'Von MixLabo geprüfte Rezepte':'Рецепты, проверенные редакцией MixLabo';document.getElementById('lang').textContent=de?'🇷🇺 RU':'🇩🇪 DE';root.replaceChildren();for(const r of rows){const c=add('article',undefined,'card');c.append(add('h2',de?r.titleDe:r.titleRu));if(r.image){const im=document.createElement('img');im.src='./'+encodeURIComponent(r.image);im.alt=de?r.titleDe:r.titleRu;im.loading='lazy';c.append(im)}if(r.author)c.append(add('p',(de?'Von: ':'Автор: ')+r.author,'muted'));c.append(add('h3',de?'Zutaten':'Ингредиенты'));c.append(add('p',de?r.ingredientsDe:r.ingredientsRu,'content'));c.append(add('h3',de?'Zubereitung':'Приготовление'));c.append(add('p',de?r.stepsDe:r.stepsRu,'content'));root.append(c)}if(!rows.length)root.textContent=de?'Noch keine Rezepte veröffentlicht.':'Пока нет опубликованных рецептов.';}document.getElementById('lang').onclick=()=>{de=!de;render()};render();</script></body></html>
