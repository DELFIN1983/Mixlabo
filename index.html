function show(v){view=v;render()}function render(){ghome.classList.toggle('active',lang==='de'&&view==='home');const p=document.getElementById('panel'),t=lang==='ru'?ru:de;if(view==='home'){p.classList.remove('active');p.innerHTML='';document.getElementById('review-entry').style.display='block';document.getElementById('review-entry').textContent=t.reviews;return}document.getElementById('review-entry').style.display='none';p.classList.add('active');const nav=`<div class="bar"><div class="brand">MixLabo</div><div class="nav">${['home','recipes','videos','ideas','partners','reviews'].map(k=>`<button data-go="${k}">${t[k]}</button>`).join('')}<button data-lang="ru">🇷🇺 RU</button><button data-lang="de">🇩🇪 DE</button></div></div>`;let body='';if(view==='reviews'){body=reviewMarkup(t)}else if(view==='recipes'){body=`<h1>${t.title}</h1><div class="cards">${items.map((r,i)=>`<button class="card" data-go="item${i}"><img src="${r.img}" alt=""><strong>${r[lang]}</strong></button>`).join('')}</div>`}else if(view.startsWith('item')){let r=items[Number(view.slice(4))];body=`<div class="recipe"><img src="${r.img}" alt=""><h1>${r[lang]}</h1><h2>${t.ingredients}</h2><p>${r[lang+'I']}</p><h2>${t.method}</h2><p>${lang==='ru'?'Подготовьте ингредиенты, смешайте в блендере или стакане, подавайте охлаждённым.':'Zutaten vorbereiten, im Mixer oder Glas vermischen und gekühlt servieren.'}</p><button class="back" data-go="recipes">${t.back}</button></div>`}else{let msg=view==='videos'?t.soon:view==='ideas'?t.idea:t.partner;body=`<h1>${t[view]}</h1><p class="muted">${msg}</p>`}p.innerHTML=nav+body;p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));p.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});if(view==='reviews')wireReviews(t)}

// Local-only review demonstration. Entries expire 72 hours after creation.
const REVIEW_KEY='mixlabo_reviews_v1', REVIEW_LIFE=72*60*60*1000;
let reviewTab='recipe';
function loadReviews(){let rows=[];try{rows=JSON.parse(localStorage.getItem(REVIEW_KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch(e){}const now=Date.now();rows=rows.filter(r=>r&&Number.isFinite(r.time)&&r.time<=now&&now-r.time<REVIEW_LIFE&&typeof r.text==='string');try{localStorage.setItem(REVIEW_KEY,JSON.stringify(rows))}catch(e){}return rows}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function drawReviews(t){const box=document.getElementById('review-list');if(!box)return;const rows=loadReviews().filter(r=>r.kind===reviewTab).reverse();box.innerHTML=rows.length?rows.map(r=>`<article class="review-post"><strong>${safe(r.author|| (lang==='ru'?'Гость':'Gast'))}</strong> <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span> ${r.kind==='recipe'?`<span>· ${safe((items[r.drink] ? items[r.drink][lang] : ''))}</span>`:''}<p>${safe(r.text)}</p><small>${new Date(r.time).toLocaleString(lang==='ru'?'ru-RU':'de-DE')}</small></article>`).join(''):`<p class="muted">${t.reviewEmpty}</p>`}
function wireReviews(t){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{reviewTab=b.dataset.tab;render()});const f=document.getElementById('review-form');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),message=String(fd.get('comment')||'').trim();if(!message){document.getElementById('review-feedback').textContent=t.reviewRequired;return}if(message.length>500){document.getElementById('review-feedback').textContent=t.reviewLimit;return}let rows=loadReviews();rows.push({kind:reviewTab,drink:reviewTab==='recipe'?Number(fd.get('drink')):null,author:String(fd.get('author')||'').trim().slice(0,40),rating:Number(fd.get('rating'))||5,text:message,time:Date.now()});try{localStorage.setItem(REVIEW_KEY,JSON.stringify(rows));f.reset();document.getElementById('review-feedback').textContent=t.reviewSaved;drawReviews(t)}catch(e){document.getElementById('review-feedback').textContent=lang==='ru'?'Не удалось сохранить отзыв в браузере.':'Speichern im Browser fehlgeschlagen.'}};drawReviews(t)}

      .ml-section-title button{background:none;border:0;color:#67eaff;text-decoration:underline;font-size:12px}
      .ml-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .ml-card{overflow:hidden;min-width:0;border:1px solid #d65ad6;border-radius:13px;background:#110c1b;color:#fff;padding:0 0 10px;text-align:left;box-shadow:0 0 10px #e545b33b}
      .ml-card:nth-child(2n){border-color:#31dff6;box-shadow:0 0 10px #30d9f53b}
      .ml-card img{display:block;width:100%;aspect-ratio:1.25/1;object-fit:cover}
      .ml-card strong{display:block;font-size:14px;padding:10px 9px 1px;line-height:1.3}
      .ml-review{width:100%;margin-top:20px}
      .panel{position:relative;inset:auto;min-height:100dvh;overflow:visible;padding:17px 14px 38px;background:radial-gradient(ellipse at 80% 5%,#241036 0%,#080811 52%,#000 100%)}
      .bar{gap:12px}.brand{font-size:32px}
      .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%}
      .nav button{font-size:12px;padding:10px 5px;min-height:43px;white-space:normal}
      .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .card img{height:130px;object-fit:cover}
      .card strong{font-size:13px;line-height:1.3}
      .recipe img{float:none;display:block;width:100%;max-height:260px;object-fit:cover;margin:0 0 16px}
      .review-form{max-width:100%}.review-tabs button{flex:1;min-height:44px}
      h1{font-size:26px}h2{font-size:21px}
    }
    @media(max-width:360px){.ml-nav button{font-size:9px}.ml-card strong{font-size:12px}.ml-cats button{font-size:12px}}
  `;
  document.head.appendChild(style);
  const mobile = document.createElement('div');
  mobile.id = 'mixlabo-mobile';
  mobile.setAttribute('aria-label','MixLabo mobile homepage');
  document.getElementById('stage').insertBefore(mobile, document.getElementById('panel'));
  function paintMobile(){
    if (typeof lang === 'undefined' || typeof view === 'undefined') return;
    mobile.hidden = view !== 'home';
    if (view !== 'home') return;
    const german = lang === 'de';
    const navNames = german ? ['Start','Rezepte','Videos','Ideen','Partner'] : ['Главная','Рецепты','Видео','Идеи','Партнёры'];
    const cats = german ? ['Smoothies','Cocktails','Limonaden','Detox','Energie','Gesundheit'] : ['Смузи','Коктейли','Лимонады','Детокс','Энергия','Здоровье'];
    const intro = german ? 'Einfache Rezepte · Frische Aromen · Ideen für jede Stimmung' : 'Простые рецепты · Яркие вкусы · Идеи для любого настроения';
    mobile.innerHTML = `
      <header class="ml-head"><div class="ml-logo">🍸 MixLabo</div><div class="ml-langs">
        <button type="button" data-ml-lang="ru" aria-pressed="${!german}">🇷🇺 RU</button>
        <button type="button" data-ml-lang="de" aria-pressed="${german}">🇩🇪 DE</button>
      </div></header>
      <nav class="ml-nav" aria-label="${german?'Navigation':'Навигация'}">${['home','recipes','videos','ideas','partners'].map((x,i)=>`<button type="button" data-ml-go="${x}"><span>${['⌂','🍸','▶','💡','🤝'][i]}</span>${navNames[i]}</button>`).join('')}</nav>
      <section class="ml-banner"><h1><span class="ml-pink">${german?'Cocktails':'Коктейли'}</span><br><span class="ml-green">${german?'Smoothies':'Смузи'}</span><br><span class="ml-yellow">${german?'Limonaden':'Лимонады'}</span></h1>
        <p>${intro}</p><button type="button" data-ml-go="recipes">${german?'Zu den Rezepten →':'Перейти к рецептам →'}</button>
        <img class="ml-banner-art" src="design.jpg" alt="MixLabo"></section>
      <div class="ml-cats">${cats.map(c=>`<button type="button" data-ml-go="recipes">${c}</button>`).join('')}</div>
      <section aria-label="${german?'Beliebte Rezepte':'Популярные рецепты'}"><div class="ml-section-title"><h2>${german?'Beliebte Rezepte':'Популярные рецепты'}</h2><button type="button" data-ml-go="recipes">${german?'Alle ansehen →':'Все рецепты →'}</button></div>
      <div class="ml-grid">${items.map((r,i)=>`<button class="ml-card" type="button" data-ml-go="item${i}"><img src="${r.img}" alt="" loading="lazy"><strong>${r[lang]}</strong></button>`).join('')}</div></section>
      <button type="button" class="ml-review" data-ml-go="reviews">⭐ ${german?'Bewertungen':'Отзывы'}</button>`;
    mobile.querySelectorAll('[data-ml-go]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.mlGo);window.scrollTo(0,0)}));
    mobile.querySelectorAll('[data-ml-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.mlLang;render()}));
  }
  // Original desktop logic (including reviews and translations) remains untouched.
  const originalRender = render;
  render = function(){originalRender();paintMobile()};
  paintMobile();
})();

</script></body></html>
