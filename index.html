<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MixLabo — Лаборатория вкуса</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:Arial,sans-serif}button{cursor:pointer;font:inherit}.stage{position:relative;width:min(100vw,150vh);height:min(100vh,66.66667vw);margin:auto;top:50%;transform:translateY(-50%);overflow:hidden;background:#030307}.design{display:block;width:100%;height:100%}.hot{position:absolute;border:0;background:transparent;color:transparent;z-index:3}#german-home{display:none;position:absolute;inset:0;pointer-events:none;z-index:2}#german-home.active{display:block}.tr{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#06050b;line-height:1.12;font-weight:bold;white-space:nowrap}.tr.top{font-size:clamp(9px,1.55vw,23px);height:6%;top:6.2%;background:#030306}.tr.hero{justify-content:flex-start;font-size:clamp(16px,3.8vw,58px);font-style:italic;left:6.2%;width:29%;height:6%;background:#09060d}.tr.sub{font-size:clamp(8px,1.42vw,21px);font-weight:normal;white-space:normal;text-align:left;justify-content:flex-start;left:6.1%;width:29%;top:39%;height:6%;background:#09060d}.tr.cta{left:6%;top:49%;width:24%;height:4%;font-size:clamp(8px,1.45vw,22px);background:#250a24;border-radius:30px;box-shadow:0 0 8px #ff4be6}.tr.cat{top:61.5%;height:4.6%;font-size:clamp(9px,1.4vw,21px);background:#07040b}.tr.pop{left:3.4%;top:70.5%;height:4%;width:37%;justify-content:flex-start;font-size:clamp(12px,2.4vw,36px);font-style:italic;color:#c1c9ff;background:#030308}.tr.all{left:77%;top:70.5%;height:4%;width:21%;font-size:clamp(8px,1.35vw,20px);color:#67eaff;background:#030308}.tr.drink{font-size:clamp(7px,1.05vw,16px);background:#0b0711;border-radius:4px} .tr.pink{color:#ff7be5;text-shadow:0 0 7px #fa2cbd}.tr.green{color:#67ff67;text-shadow:0 0 7px #28f35c}.tr.yellow{color:#ffe37c;text-shadow:0 0 7px #ffb522} .lang-on{position:absolute;top:4%;left:91.4%;width:6.3%;height:6%;border:2px solid #ff67e8;border-radius:22px;box-shadow:0 0 9px #ff5bdf;pointer-events:none} .hot:focus-visible{outline:3px solid #00eaff;border-radius:10px}.panel{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 10%,#241036 0%,#080811 50%,#000 100%);display:none;z-index:5;overflow:auto;padding:clamp(14px,3%,42px)}.panel.active{display:block}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:3%;flex-wrap:wrap}.brand{font-size:clamp(24px,4vw,48px);font-weight:bold;font-style:italic;color:#ff5bc9;text-shadow:0 0 14px #f09}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.back,.chip{background:#080913;color:#fff;border:1px solid #f06ad8;border-radius:22px;padding:9px 13px;box-shadow:0 0 9px #e05ca855}.nav button:hover,.back:hover,.chip:hover{background:#45234e}h1{color:#6de7ff;text-shadow:0 0 14px #00dfff;font-size:clamp(23px,3vw,40px)}p{line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2%;margin-top:20px}.card{min-width:0;background:#0c0d19;border:1px solid #18ddf7;border-radius:14px;overflow:hidden;color:#fff;text-align:left;padding:0 0 12px;box-shadow:0 0 12px #00d5ef44}.card img{width:100%;height:clamp(90px,18vh,200px);object-fit:contain;background:#05060b}.card strong{display:block;padding:7px 10px}.recipe{max-width:750px;margin:auto}.recipe img{width:min(220px,40%);float:right;margin:0 0 12px 18px;border-radius:12px}.muted{color:#b8c5d7}.back{margin-top:12px}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.nav button{padding:7px 9px;font-size:12px}}

/* German typography is fitted inside the same fixed 3:2 artwork as Russian. */
#german-home .tr.top{font-size:clamp(8px,1.15vw,17px)}
#german-home .tr.hero{font-size:clamp(15px,3.25vw,48px);height:5.6%}
#german-home .tr.sub{font-size:clamp(8px,1.12vw,16px);line-height:1.08}
#german-home .tr.cta{font-size:clamp(8px,1.14vw,16px)}
#german-home .tr.cat{font-size:clamp(8px,1.15vw,16px);height:3.9%}
#german-home .tr.pop{font-size:clamp(12px,2.1vw,29px)}
#german-home .tr.all{font-size:clamp(8px,1.05vw,15px)}
#german-home .tr.drink{font-size:clamp(7px,1.0vw,14px);height:2.6%;top:91.9%;padding:0 1px;overflow:hidden}

/* Reviews: isolated additions; original artwork remains unchanged */
.review-entry{position:absolute;z-index:4;right:2.5%;top:13.5%;padding:7px 13px;border:1px solid #ff74e5;border-radius:22px;background:#140a20;color:#fff;box-shadow:0 0 12px #ed4fba;font-size:clamp(9px,1.2vw,15px)}
.review-tabs{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.review-tabs button{border:1px solid #47dfff;background:#111326;color:#fff;border-radius:18px;padding:10px 15px}.review-tabs button.selected{background:#193f50;border-color:#ff71d5}
.review-form{display:grid;gap:12px;max-width:620px}.review-form input,.review-form textarea,.review-form select{background:#090b19;color:white;border:1px solid #5c8ea5;border-radius:10px;padding:12px;font:inherit;width:100%}.review-form textarea{min-height:90px;resize:vertical}.review-form label{display:grid;gap:5px}.review-form button{justify-self:start;padding:10px 20px;border-radius:20px;background:#35124b;border:1px solid #ff74e5;color:white}.review-note{color:#a8b6c7;font-size:13px}.review-list{display:grid;gap:10px;margin-top:20px}.review-post{border:1px solid #265c76;border-radius:12px;padding:12px;background:#0b1120}.review-post small{color:#aebccc}.review-post p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.review-stars{color:#ffd45c}
</style></head><body><main class="stage" id="stage"><img class="design" src="design.jpg" alt="MixLabo — утверждённая главная страница"><div id="german-home" aria-hidden="true"></div><div id="hotspots"></div><button class="review-entry" id="review-entry" type="button">Отзывы</button><section class="panel" id="panel" aria-live="polite"></section></main><script>
const ru={home:'Главная',recipes:'Рецепты',videos:'Видео',ideas:'Идеи',partners:'Партнёры',title:'Популярные рецепты',soon:'Здесь появятся наши собственные видео приготовления напитков.',idea:'Скоро здесь будут новые идеи и сочетания вкусов.',partner:'Здесь появится информация для сотрудничества.',ingredients:'Ингредиенты',method:'Приготовление',back:'Назад к рецептам',reviews:'Отзывы',reviewRecipe:'О рецептах',reviewSite:'О сайте',reviewName:'Имя (необязательно)',reviewText:'Ваш комментарий',reviewRating:'Оценка',reviewChoose:'Выберите рецепт',reviewSend:'Опубликовать',reviewEmpty:'Пока нет комментариев.',reviewSaved:'Комментарий сохранён на этом устройстве.',reviewNote:'Демо: комментарии видны только в этом браузере и автоматически удаляются через 72 часа. Для общего доступа понадобится сервер.',reviewRequired:'Напишите комментарий.',reviewLimit:'Максимум 500 символов.'};
const de={home:'Startseite',recipes:'Rezepte',videos:'Videos',ideas:'Ideen',partners:'Partner',title:'Beliebte Rezepte',soon:'Hier erscheinen bald unsere eigenen Videos zur Getränkezubereitung.',idea:'Hier erscheinen neue Geschmacksideen.',partner:'Hier finden Sie künftig Informationen zur Zusammenarbeit.',ingredients:'Zutaten',method:'Zubereitung',back:'Zurück zu Rezepten',reviews:'Bewertungen',reviewRecipe:'Zu Rezepten',reviewSite:'Zur Website',reviewName:'Name (optional)',reviewText:'Ihr Kommentar',reviewRating:'Bewertung',reviewChoose:'Rezept auswählen',reviewSend:'Veröffentlichen',reviewEmpty:'Noch keine Kommentare.',reviewSaved:'Kommentar auf diesem Gerät gespeichert.',reviewNote:'Demo: Kommentare sind nur in diesem Browser sichtbar und werden nach 72 Stunden automatisch gelöscht. Für alle Besucher ist ein Server nötig.',reviewRequired:'Bitte Kommentar eingeben.',reviewLimit:'Maximal 500 Zeichen.'};
let lang='ru', view='home';const items=[
{ru:'Клубничный смузи',de:'Erdbeer-Smoothie',img:'drink1.jpg',ruI:'Клубника 150 г, банан 1 шт., йогурт 100 мл.',deI:'150 g Erdbeeren, 1 Banane, 100 ml Joghurt.'},
{ru:'Манго Мохито',de:'Mango-Mojito',img:'drink2.jpg',ruI:'Манго 100 г, лайм ½ шт., мята, газированная вода 150 мл.',deI:'100 g Mango, ½ Limette, Minze, 150 ml Sprudelwasser.'},
{ru:'Tequila Sunrise',de:'Tequila Sunrise',img:'drink3.jpg',ruI:'Апельсиновый сок 150 мл, сироп гренадин 15 мл; безалкогольная версия.',deI:'150 ml Orangensaft, 15 ml Grenadine; alkoholfreie Variante.'},
{ru:'Голубая лагуна',de:'Blaue Lagune',img:'drink4.jpg',ruI:'Лимонад 150 мл, сироп блю кюрасао без алкоголя 20 мл, лёд.',deI:'150 ml Limonade, 20 ml alkoholfreier Blue-Curaçao-Sirup, Eis.'},
{ru:'Лесные ягоды',de:'Waldbeeren',img:'drink5.jpg',ruI:'Смесь ягод 150 г, йогурт 100 мл, мёд по вкусу.',deI:'150 g Beerenmischung, 100 ml Joghurt, Honig nach Geschmack.'},
{ru:'Детокс Микс',de:'Detox-Mix',img:'drink6.jpg',ruI:'Огурец ½ шт., лайм ½ шт., мята, вода 150 мл.',deI:'½ Gurke, ½ Limette, Minze, 150 ml Wasser.'}];
const positions=[['home',35.5,0,9.5,13],['recipes',45,0,9,13],['videos',55,0,9,13],['ideas',65,0,8,13],['partners',73,0,10,13],['ru',85.5,1,7,10],['de',92.5,1,6.5,10],['recipes',4,46,27,9],['recipes',78,69,21,7]];
for(let i=0;i<6;i++)positions.push(['item'+i,3.3+i*16.05,76.5,15.5,21]);
const hot=document.getElementById('hotspots');positions.forEach(([key,x,y,w,h])=>{let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',key);b.onclick=()=>{if(key==='ru'||key==='de'){lang=key;render()}else show(key)};hot.appendChild(b)});
const ghome=document.getElementById('german-home');
const overlays=[
['Startseite',35.6,6.2,9.2,6,'top pink'],['Rezepte',45.1,6.2,9.2,6,'top'],['Videos',55,6.2,9.2,6,'top'],['Ideen',65,6.2,8,6,'top'],['Partner',73,6.2,10,6,'top'],
['Cocktails',6.2,18,29,6,'hero pink'],['Smoothies',6.2,24.5,29,6,'hero green'],['Limonaden',6.2,31,29,6,'hero yellow'],
['Einfache Rezepte · Frische Aromen · Ideen für jede Stimmung',6.1,39,29,6,'sub'],['Zu den Rezepten →',6,49,24,4,'cta'],
['Smoothies',3.6,61.5,14.7,4.6,'cat'],['Cocktails',19.7,61.5,14.7,4.6,'cat'],['Limonaden',35.7,61.5,14.7,4.6,'cat'],['Detox',51.7,61.5,14.7,4.6,'cat'],['Energie',67.7,61.5,14.7,4.6,'cat'],['Gesundheit',83.6,61.5,13.5,4.6,'cat'],
['Beliebte Rezepte',3.4,70.5,37,4,'pop'],['Alle Rezepte ansehen →',77,70.5,21,4,'all'],
['Erdbeer-Smoothie',3.4,90.8,15.1,5.3,'drink'],['Mango-Mojito',19.5,91.5,15.1,3.6,'drink'],['Tequila Sunrise',35.55,91.5,15.1,3.6,'drink'],['Blaue Lagune',51.6,91.5,15.1,3.6,'drink'],['Waldbeeren',67.65,91.5,15.1,3.6,'drink'],['Detox-Mix',83.7,91.5,13.4,3.6,'drink']];
ghome.innerHTML=overlays.map(([label,x,y,w,h,cls])=>`<div class="tr ${cls}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${label}</div>`).join('');
function show(v){view=v;render()}function render(){ghome.classList.toggle('active',lang==='de'&&view==='home');const p=document.getElementById('panel'),t=lang==='ru'?ru:de;if(view==='home'){p.classList.remove('active');p.innerHTML='';document.getElementById('review-entry').style.display='block';document.getElementById('review-entry').textContent=t.reviews;return}document.getElementById('review-entry').style.display='none';p.classList.add('active');const nav=`<div class="bar"><div class="brand">MixLabo</div><div class="nav">${['home','recipes','videos','ideas','partners','reviews'].map(k=>`<button data-go="${k}">${t[k]}</button>`).join('')}<button data-lang="ru">🇷🇺 RU</button><button data-lang="de">🇩🇪 DE</button></div></div>`;let body='';if(view==='reviews'){body=reviewMarkup(t)}else if(view==='recipes'){body=`<h1>${t.title}</h1><div class="cards">${items.map((r,i)=>`<button class="card" data-go="item${i}"><img src="${r.img}" alt=""><strong>${r[lang]}</strong></button>`).join('')}</div>`}else if(view.startsWith('item')){let r=items[Number(view.slice(4))];body=`<div class="recipe"><img src="${r.img}" alt=""><h1>${r[lang]}</h1><h2>${t.ingredients}</h2><p>${r[lang+'I']}</p><h2>${t.method}</h2><p>${lang==='ru'?'Подготовьте ингредиенты, смешайте в блендере или стакане, подавайте охлаждённым.':'Zutaten vorbereiten, im Mixer oder Glas vermischen und gekühlt servieren.'}</p><button class="back" data-go="recipes">${t.back}</button></div>`}else{let msg=view==='videos'?t.soon:view==='ideas'?t.idea:t.partner;body=`<h1>${t[view]}</h1><p class="muted">${msg}</p>`}p.innerHTML=nav+body;p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));p.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});if(view==='reviews')wireReviews(t)}

// Local-only review demonstration. Entries expire 72 hours after creation.
const REVIEW_KEY='mixlabo_reviews_v1', REVIEW_LIFE=72*60*60*1000;
let reviewTab='recipe';
function loadReviews(){let rows=[];try{rows=JSON.parse(localStorage.getItem(REVIEW_KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch(e){}const now=Date.now();rows=rows.filter(r=>r&&Number.isFinite(r.time)&&r.time<=now&&now-r.time<REVIEW_LIFE&&typeof r.text==='string');try{localStorage.setItem(REVIEW_KEY,JSON.stringify(rows))}catch(e){}return rows}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reviewMarkup(t){return `<h1>${t.reviews}</h1><div class="review-tabs"><button type="button" data-tab="recipe" class="${reviewTab==='recipe'?'selected':''}">${t.reviewRecipe}</button><button type="button" data-tab="site" class="${reviewTab==='site'?'selected':''}">${t.reviewSite}</button></div><form class="review-form" id="review-form">${reviewTab==='recipe'?`<label>${t.reviewChoose}<select name="drink">${items.map((r,i)=>`<option value="${i}">${safe(r[lang])}</option>`).join('')}</select></label>`:''}<label>${t.reviewName}<input name="author" maxlength="40" autocomplete="nickname"></label><label>${t.reviewRating}<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)}</option>`).join('')}</select></label><label>${t.reviewText}<textarea name="comment" maxlength="500" required></textarea></label><button type="submit">${t.reviewSend}</button><div id="review-feedback" role="status"></div></form><p class="review-note">${t.reviewNote}</p><div id="review-list" class="review-list"></div>`}
function drawReviews(t){const box=document.getElementById('review-list');if(!box)return;const rows=loadReviews().filter(r=>r.kind===reviewTab).reverse();box.innerHTML=rows.length?rows.map(r=>`<article class="review-post"><strong>${safe(r.author|| (lang==='ru'?'Гость':'Gast'))}</strong> <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span> ${r.kind==='recipe'?`<span>· ${safe(items[r.drink]?.[lang]||'')}</span>`:''}<p>${safe(r.text)}</p><small>${new Date(r.time).toLocaleString(lang==='ru'?'ru-RU':'de-DE')}</small></article>`).join(''):`<p class="muted">${t.reviewEmpty}</p>`}
function wireReviews(t){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{reviewTab=b.dataset.tab;render()});const f=document.getElementById('review-form');f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),message=String(fd.get('comment')||'').trim();if(!message){document.getElementById('review-feedback').textContent=t.reviewRequired;return}if(message.length>500){document.getElementById('review-feedback').textContent=t.reviewLimit;return}let rows=loadReviews();rows.push({kind:reviewTab,drink:reviewTab==='recipe'?Number(fd.get('drink')):null,author:String(fd.get('author')||'').trim().slice(0,40),rating:Number(fd.get('rating'))||5,text:message,time:Date.now()});try{localStorage.setItem(REVIEW_KEY,JSON.stringify(rows));f.reset();document.getElementById('review-feedback').textContent=t.reviewSaved;drawReviews(t)}catch(e){document.getElementById('review-feedback').textContent=lang==='ru'?'Не удалось сохранить отзыв в браузере.':'Speichern im Browser fehlgeschlagen.'}};drawReviews(t)}
document.getElementById('review-entry').onclick=()=>show('reviews');
// Recheck expiry when visitors revisit or interact with the reviews view.
loadReviews();render();
</script></body></html>
